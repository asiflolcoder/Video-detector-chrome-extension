<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product robustness verification</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 1.5rem; }
  #suite-root ul { list-style: none; padding: 0; }
  #suite-root li { margin: 0.25rem 0; padding: 0.4rem 0.6rem; border-left: 4px solid #999; }
  #suite-root li.pass { background: #e8f5e9; border-left-color: #2e7d32; }
  #suite-root li.fail { background: #fbe9e7; border-left-color: #c62828; }
</style>
</head>
<body>
<h1>Product-level checks (stress)</h1>
<div id="suite-root"></div>

<script src="../../content/src/detector.js"></script>
<script src="../../content/src/visibility.js"></script>
<script src="../../content/src/playback.js"></script>
<script src="../../content/src/metadata.js"></script>
<script src="../../content/src/scorer.js"></script>
<script src="../lib/harness.js"></script>
<script src="tests.js"></script>
<script>
(function () {
  const outcome = VD.runSuites(document.getElementById("suite-root"), ["stress"]);
  document.title = "Stress verification: " + outcome.totalPassed + " passed, " + outcome.totalFailed + " failed";
  document.documentElement.setAttribute("data-stress-result", outcome.totalFailed === 0 ? "PASS" : "FAIL");
})();
</script>
</body>
</html>
