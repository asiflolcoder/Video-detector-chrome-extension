<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VideoDetect Phase 1 smoke — running…</title>
</head>
<body>
<h1>VideoDetect — content-script wiring smoke test</h1>
<p>Simulates the content-script lifecycle: initial report on load, then a video
injected 500ms later which the MutationObserver should pick up.</p>
<ul id="log"></ul>
<p id="summary">Running…</p>

<script>
  // Capture console output so the harness can assert on what index.js logged.
  (function () {
    var logList = document.getElementById("log");
    var originalLog = console.log.bind(console);
    console.log = function () {
      var li = document.createElement("li");
      li.textContent = Array.prototype.slice.call(arguments).join(" ");
      logList.appendChild(li);
      originalLog.apply(null, arguments);
    };
  })();
</script>

<script src="../content/src/collect.js"></script>
<script src="../content/src/score.js"></script>
<script src="../content/src/detect.js"></script>
<script src="../content/src/index.js"></script>

<script>
  // Inject a video after load to exercise the MutationObserver rescan path.
  setTimeout(function () {
    var video = document.createElement("video");
    video.setAttribute("src", "https://example.com/media/late.mp4");
    video.setAttribute("controls", "");
    video.setAttribute("width", "960");
    video.setAttribute("height", "540");
    video.setAttribute("preload", "none");
    document.body.appendChild(video);
  }, 500);

  // Give the observer + debounce time to run, then summarize.
  setTimeout(function () {
    var entries = Array.prototype.map.call(document.querySelectorAll("#log li"), function (li) { return li.textContent; });
    var sawInitial = entries.some(function (e) { return e.indexOf("no candidate video found") !== -1; });
    var sawLate = entries.some(function (e) { return e.indexOf("most relevant video") !== -1 && e.indexOf("late.mp4") !== -1; });
    var ok = sawInitial && sawLate;
    var summary = document.getElementById("summary");
    summary.textContent = "smoke: " + (ok ? "PASS" : "FAIL") +
      " (initial report: " + sawInitial + ", late-video report: " + sawLate + ")";
    console.log("[VideoDetect smoke] " + summary.textContent);
    document.title = "VideoDetect smoke: " + (ok ? "PASS" : "FAIL");
    document.documentElement.setAttribute("data-smoke-result", ok ? "PASS" : "FAIL");
  }, 2000);
</script>
</body>
</html>
